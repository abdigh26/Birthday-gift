<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 21st Birthday Hodan!</title>
    <style>
        /* Modern Reset and Google Fonts Import */
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fce7f3 100%);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        /* Ambient Confetti Canvas Container */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Top Bar Music Button Arrangement */
        .header-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .music-btn {
            background: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(219, 39, 119, 0.1);
            cursor: pointer;
            font-weight: 600;
            color: #db2777;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            border: 1px solid #fbcfe8;
        }

        .music-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(219, 39, 119, 0.2);
            background: #fff1f2;
        }

        /* Celebration Layout Wrapper */
        .celebration-container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            width: 100%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            text-align: center;
        }

        /* Hero Header Typography Styling */
        .hero-title {
            animation: bounceIn 1.5s ease-out;
        }

        .badge-21 {
            background: linear-gradient(45deg, #f43f5e, #db2777);
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 8px 20px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(236, 72, 153, 0.4);
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 3.5rem;
            color: #4c0519;
            font-weight: 700;
            line-height: 1.2;
        }

        h1 span {
            background: linear-gradient(to right, #ec4899, #be185d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Caveat', cursive;
            font-size: 4.5rem;
            display: block;
        }

        /* Main Interactive Card Setup */
        .main-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(219, 39, 119, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.7);
            width: 100%;
            transition: transform 0.3s ease;
        }

        .main-card:hover {
            transform: translateY(-5px);
        }

        /* Dedicated Section for Sister Attributes */
        .attributes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .attribute-box {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.03);
            border: 1px solid #ffe4e6;
            transition: all 0.3s ease;
        }

        .attribute-box:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(219, 39, 119, 0.1);
            border-color: #fbcfe8;
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        .attribute-box h3 {
            color: #9d174d;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .attribute-box p {
            color: #4c0519;
            font-size: 0.9rem;
            line-height: 1.5;
            opacity: 0.8;
        }

        /* Beautiful Photo Frame pointing directly to your GitHub Assets folder */
        .photo-frame {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 300px;
            margin: 0 auto 30px auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.15);
            border: 8px solid white;
            transform: rotate(-2deg);
            transition: all 0.5s ease;
        }

        .photo-frame:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(157, 23, 77, 0.85));
            color: white;
            padding: 20px 15px 10px 15px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* 2-Second Styled Video Element and Wrapper */
        .video-wrapper {
            width: 100%;
            max-width: 450px;
            margin: 0 auto 30px auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.15);
            background: #4c0519;
            aspect-ratio: 16/9;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Video State Overlay Box */
        .video-placeholder-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(76, 5, 25, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            text-align: center;
            z-index: 3;
            transition: opacity 0.5s ease;
        }

        .video-placeholder-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .play-spark {
            background: linear-gradient(45deg, #f43f5e, #db2777);
            border: none;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(219, 39, 119, 0.6);
            transition: transform 0.3s ease;
        }

        .play-spark:hover {
            transform: scale(1.1);
        }

        /* Message Box Container */
        .message-box {
            background: #fff5f7;
            border-left: 5px solid #db2777;
            padding: 25px;
            border-radius: 0 16px 16px 0;
            margin-top: 20px;
            text-align: left;
            position: relative;
        }

        .message-box h2 {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            color: #9d174d;
            margin-bottom: 10px;
        }

        .message-box p {
            color: #4c0519;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        /* Interactive Poppable Balloons Layer */
        .balloon-container {
            position: fixed;
            bottom: -100px;
            width: 100%;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            width: 60px;
            height: 75px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            pointer-events: auto;
            animation: floatUp 8s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
        }

        .balloon::after {
            content: "🎈";
            font-size: 2.5rem;
            position: absolute;
        }

        /* CSS Animation Keyframes Definition */
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-120vh) rotate(20deg);
                opacity: 0;
            }
        }

            0% {
                opacity: 0;
                transform: scale(0.3);
